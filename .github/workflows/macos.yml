name: macOS build (Qt6)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v3.0.0*'
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Compile with AppleClang and Qt6 (QTextBrowser fallback, arm64)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install \
            cmake ninja pkg-config git \
            qt@6 exiv2 lcms2 fftw libraw eigen boost gsl openexr \
            libtiff libpng libjpeg-turbo cfitsio libomp

      - name: Configure
        run: |
          OPENMP_PREFIX="$(brew --prefix libomp)"
          MACOS_MIN=$(sw_vers -productVersion | awk -F. '{print $1 ".0"}')
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_WEBENGINE=OFF \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOS_MIN" \
            -DCMAKE_PREFIX_PATH="$(brew --prefix):$(brew --prefix qt@6)" \
            -DOpenMP_ROOT="$OPENMP_PREFIX" \
            -DOpenMP_C_FLAGS="-Xpreprocessor -fopenmp -I$OPENMP_PREFIX/include" \
            -DOpenMP_CXX_FLAGS="-Xpreprocessor -fopenmp -I$OPENMP_PREFIX/include" \
            -DOpenMP_C_LIB_NAMES=omp \
            -DOpenMP_CXX_LIB_NAMES=omp \
            -DOpenMP_omp_LIBRARY="$OPENMP_PREFIX/lib/libomp.dylib"

      - name: Build
        run: cmake --build build --parallel

      - name: Deploy Qt frameworks and plugins
        run: |
          APP=$(find build -maxdepth 1 -type d -name 'Luminance HDR*.app' -print -quit)
          test -n "$APP"
          "$(brew --prefix qt@6)/bin/macdeployqt" "$APP" \
            -executable="$APP/Contents/MacOS/luminance-hdr-cli" -no-strip
          codesign --force --deep --sign - "$APP"

      - name: Smoke test CLI
        run: |
          APP=$(find build -maxdepth 1 -type d -name 'Luminance HDR*.app' -print -quit)
          test -n "$APP"
          set +e
          "$APP/Contents/MacOS/luminance-hdr-cli" --help > cli-help.txt 2>&1
          STATUS=$?
          set -e
          test "$STATUS" -eq 1
          grep -q "Usage:" cli-help.txt
          rm cli-help.txt

      - name: Prepare artifact name
        run: |
          ARTIFACT_VERSION=$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9._-' '-')
          echo "ARTIFACT_VERSION=$ARTIFACT_VERSION" >> "$GITHUB_ENV"

      - name: Compress app bundle
        run: |
          APP=$(find build -maxdepth 1 -type d -name 'Luminance HDR*.app' -print -quit)
          ditto -c -k --sequesterRsrc --keepParent "$APP" \
            "luminance-hdr-${ARTIFACT_VERSION}-macos-arm64.zip"

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: luminance-hdr-${{ env.ARTIFACT_VERSION }}-macos-arm64
          path: luminance-hdr-${{ env.ARTIFACT_VERSION }}-macos-arm64.zip
          if-no-files-found: error
